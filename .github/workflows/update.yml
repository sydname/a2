name: 캐릭터 정보 갱신

on:
  schedule:
    # 매일 00:00 KST (= 전날 15:00 UTC). cron 은 UTC 기준입니다.
    - cron: "0 15 * * *"
  workflow_dispatch: {}        # 저장소 Actions 탭에서 수동 실행 가능
  push:
    branches: [main]
    paths:
      - "characters.json"      # 캐릭터 목록을 바꾸면 즉시 한 번 갱신

permissions:
  contents: write              # 수집 결과를 저장소에 커밋

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 캐릭터 정보 수집
        run: python scripts/fetch.py --config characters.json --out docs/data

      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 캐릭터 정보 자동 갱신 ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
